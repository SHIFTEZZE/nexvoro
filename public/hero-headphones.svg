<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Illustrated over-ear headphones">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="22" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <!-- Headband -->
    <path d="M190 300 C190 160 450 160 450 300"
          fill="none" stroke="url(#band)" stroke-width="46" stroke-linecap="round"/>
    <path d="M210 300 C210 190 430 190 430 300"
          fill="none" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

    <!-- Left earcup -->
    <ellipse cx="205" cy="380" rx="72" ry="110" fill="url(#cup)"/>
    <ellipse cx="205" cy="380" rx="72" ry="110" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="218" cy="380" rx="52" ry="88" fill="url(#cushion)"/>
    <ellipse cx="228" cy="380" rx="34" ry="72" fill="#475569" opacity="0.65"/>
    <ellipse cx="205" cy="380" rx="16" ry="28" fill="#e2e8f0" opacity="0.55"/>

    <!-- Right earcup -->
    <ellipse cx="435" cy="380" rx="72" ry="110" fill="url(#cup)"/>
    <ellipse cx="435" cy="380" rx="72" ry="110" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="422" cy="380" rx="52" ry="88" fill="url(#cushion)"/>
    <ellipse cx="412" cy="380" rx="34" ry="72" fill="#475569" opacity="0.65"/>
    <ellipse cx="435" cy="380" rx="16" ry="28" fill="#e2e8f0" opacity="0.55"/>

    <!-- Hinge details -->
    <circle cx="205" cy="290" r="10" fill="#94a3b8"/>
    <circle cx="435" cy="290" r="10" fill="#94a3b8"/>
  </g>

  <!-- Soft floor reflection -->
  <ellipse cx="320" cy="560" rx="180" ry="14" fill="#0f172a" opacity="0.06"/>
</svg>
